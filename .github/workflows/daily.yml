name: daily

# ★ L2-B：每日自动化。每天北京时间凌晨跑一次（UTC 16:30 = 北京时间次日 00:30）。
# 编排：collect → enrich → signals → relate → report，然后 commit 真源回 public。
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write # ★ commit/push 真源需要写权限
  # ★ L8-C：发布静态站点到 GitHub Pages（Actions 构建模式）
  pages: write
  id-token: write

jobs:
  daily:
    runs-on: ubuntu-24.04 # ★ 固定，不用 ubuntu-latest（红线 12）
    timeout-minutes: 60
    env:
      AI_SCHOLAR_ENV: actions
      # ★ L8-A：LLM 凭据放在 **job 级** —— enhance / grade / analyze 都要用；
      #   只挂在 analyze 上会让前两步恒为 off 档（2026-10-26 实测：runs.mode=off）。
      #   未配 secret 时为空 ⇒ effective_mode 自动降级 off，整条链路 0 花费、退出 0。
      AI_SCHOLAR_LLM__BASE_URL: ${{ secrets.AI_SCHOLAR_LLM__BASE_URL }}
      AI_SCHOLAR_LLM__API_KEY: ${{ secrets.AI_SCHOLAR_LLM__API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      # ★ db 是"可丢弃缓存"（§3.7.1）：用 actions-cache 跨天续命，避免每天重采全部引用。
      #   但它不是唯一依托 —— 失效时 first_seen.jsonl / signals（git 真源）不受影响。
      #   ★ 标准单一步骤：主步骤按 restore-keys 恢复最近的 db，post（job 末尾）用新 key 保存。
      #   不要再加显式 Save 步骤 —— 固定 key 的第二个 cache 步骤会 hit 同一 key、
      #   用旧 db 覆盖 signals 更新（2026-10-24 实跑踩中）。
      - name: Restore db cache
        uses: actions/cache@v4
        with:
          path: data/ai_scholar.db
          key: ai-scholar-db-${{ github.run_id }}
          restore-keys: |
            ai-scholar-db-

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Collect
        run: uv run ai-scholar collect

      # ★ L7-5：经典种子清单直采（config/classics.yaml，arXiv id_list）。
      #   经典文献不在「7 天回看 / HF 当日榜单」里，必须有独立获取路径；
      #   已入库的条目命中 upsert 的"内容未变 ⇒ deduped"，不会每天新增。
      - name: Collect classics
        run: uv run ai-scholar collect --classics

      - name: Enrich
        run: uv run ai-scholar enrich

      - name: Signals
        run: uv run ai-scholar signals

      - name: Relate
        run: uv run ai-scholar relate

      - name: Enhance
        run: uv run ai-scholar enhance

      - name: Grade
        run: uv run ai-scholar grade

      # ★ L7-1：`analyze` 接入自动管道（§5.5 通道 A"立刻执行"）。
      #   ★ 凭据在 job 级（见上），off 档时 run_deep_analysis 直接返回 0 调用、退出 0。
      #   ★ 每周最多 5 篇（注意力预算），稳定后每天约 1 篇。
      - name: Analyze
        run: uv run ai-scholar analyze

      # ★ L7-4：核对 public 真源 data/analyses/ 齐备（零 LLM / 零网络）。
      #   缺失 ⇒ 退出码 1，让"分析过但产物没落盘"这类静默失败在 CI 里直接变红。
      - name: Check analyses source
        run: uv run ai-scholar analyze --check

      # ★ L4：零 LLM / 零网络。先生成可验证推演（同目标已有 open 则跳过），再验证到期项
      - name: Predict
        run: uv run ai-scholar predict

      - name: Verify predictions
        run: uv run ai-scholar stats --verify

      - name: Report
        run: uv run ai-scholar report

      # ★ L8-F：成本 guard —— 只**标注**不阻断（退出码仍 0）。
      #   GitHub 会把 `::warning::` 显示在 run 上，并在 Actions 页面标黄；
      #   判定规则与 `ai-scholar cost` 完全一致（同一份代码，不重复实现）。
      - name: Cost guard
        run: |
          uv run ai-scholar cost --json > /tmp/cost.json
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/cost.json").read_text(encoding="utf-8"))
          print(f"今日 ¥{data['today']:.4f} · 本月 ¥{data['month']:.4f} · 本年 ¥{data['year']:.4f}")
          for reason in data["anomalies"]:
              print(f"::warning title=成本异常::{reason}")
          PY

      # ★ 持久化真源（§8.3 定案 C′）：first_seen / signals / 报告 commit 回 public；
      #   db 被 .gitignore 排除，不 commit。
      #   并发冲突：先 commit 再 fetch + rebase（★ 不能用 reset --soft FETCH_HEAD ——
      #   它会丢"checkout 之后远程新增 commit"的改动，2026-10-24 实跑已踩）。
      # ★ L8-C：站点发布 —— 必须**在 daily job 内构建**：站点要读 db 元数据，
      #   db 只在 Actions 缓存里（git 里没有），单独的 pages workflow 拿不到。
      - name: Build site
        run: uv run ai-scholar site --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/first_seen.jsonl data/signals data/reports data/predictions data/analyses
          if git diff --cached --quiet; then
            echo "无变更，跳过 commit"
            exit 0
          fi
          git commit -m "chore(daily): 每日采集与报告 $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  # ★ L8-C：部署到 GitHub Pages（https://tochikoma777.github.io/ai-scholar/）
  #   独立 job：deploy-pages 需要 `github-pages` environment 与 OIDC 权限，
  #   混在 daily 里会让"部署失败"看起来像"采集失败"。
  deploy-pages:
    needs: daily
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
