# ★ 经典论文种子清单（v1.11 定案：`config/classics.yaml`）
#
# 定位：**人工审校入口** —— 只有被公认的经典才进清单，**不用算法猜"什么是经典"**。
# 经典文献不会出现在「arXiv 7 天回看」或「HF 当日榜单」里，必须有独立获取路径。
#
# 消费方（★ 每个字段都要有读者，不留死配置）：
#   1. `collect --classics`：用 arXiv `id_list` **批量直采**入库（ID 确定、无搜索噪声）；
#   2. 深度分析 D 排序的**经典侧**（`pipeline/deep_analysis.py`）：清单内的论文是经典候选。
#
# 字段分工：
#   `note`  = 简称（给人看）
#   `title` = **实测标题**（给机器核对）—— 由 `uv run python scripts/probe_classics.py` 比对。
# ★ 2026-10-25 实测：本清单全部 id 真实命中且标题逐条核对通过（41 → 49 条）。
#   id 写错会静默拉到别的论文（如把 T5 写成 1910.01108 会拉到 DistilBERT），
#   **新增条目后必须跑探测脚本复核**，不许凭印象声称"清单已核验"。

