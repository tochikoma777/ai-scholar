# AI Scholar 主配置。
#
# ★ 凡是"环境开关"（api_key / base_url / 运行档位）**必须**写成 `${ENV}` 占位符：
#   `load_settings()` 用 `Settings(**yaml)` 构造，init kwargs 优先级高于环境变量，
#   写成字面量会把环境变量静默压掉（aipulse 踩过的坑）。
#   算法阈值 / 规模参数可以留字面量。

app:
  timezone: Asia/Shanghai          # 存储统一 UTC，仅渲染层转此时区
  data_dir: data
  # ★ 唯一消费点：cli.main() 用它初始化 structlog（AI_SCHOLAR_LOG_LEVEL=DEBUG 可放大日志）
  log_level: ${AI_SCHOLAR_LOG_LEVEL:-INFO}

# 三档运行模式：off = 零 API 花费；fast = 便宜档；strong = 推理档
# ★ 缺 api_key（或 base_url）时自动降级 off，不报错退出（退出码 0）
mode: ${AI_SCHOLAR_MODE:-fast}

llm:
  enabled: ${AI_SCHOLAR_LLM__ENABLED:-true}
  provider: deepseek
  base_url: ${AI_SCHOLAR_LLM__BASE_URL}
  api_key: ${AI_SCHOLAR_LLM__API_KEY}
  fast_model: ${AI_SCHOLAR_LLM__FAST_MODEL:-deepseek-v4-flash}
  strong_model: ${AI_SCHOLAR_LLM__STRONG_MODEL:-deepseek-v4-pro}
  temperature: 0.3
  # strong 档走思维链，比 fast 慢得多，故分开设超时
  timeout_s: ${AI_SCHOLAR_LLM__TIMEOUT_S:-120}
  timeout_strong_s: ${AI_SCHOLAR_LLM__TIMEOUT_STRONG_S:-180}
  # ★ 2026-10-25 端到端实测：deepseek-v4-flash 会把 token 花在推理上，
  #   4000 会被推理吃光导致正式答案被截断（定级表停在表头，Tier 解析失败）。
  #   抬到 8000 让答案完整；输出单价 ¥2/M，抬高上限不强制多产出，成本基本不变。
  max_tokens_fast: ${AI_SCHOLAR_LLM__MAX_TOKENS_FAST:-8000}
  # ★ 2026-10-26 Actions 实测（E6 复发）：strong 档带 100k 正文时，8000 会被
  #   **推理全部吃光**（tokens_out=8000 / content 0 字符，占当次调用 50%，纯浪费）。
  #   ⇒ 16000 = 推理 ~8k + 答案 ~4-6k，留余量；输出按实际计费，上限不强制多产出。
  max_tokens_strong: ${AI_SCHOLAR_LLM__MAX_TOKENS_STRONG:-16000}
  max_retries: 3

budget:
  daily_limit_cny: ${AI_SCHOLAR_BUDGET__DAILY_LIMIT_CNY:-2.0}
  weekly_limit_cny: ${AI_SCHOLAR_BUDGET__WEEKLY_LIMIT_CNY:-10.0}
  monthly_limit_cny: ${AI_SCHOLAR_BUDGET__MONTHLY_LIMIT_CNY:-40.0}
  yearly_limit_cny: ${AI_SCHOLAR_BUDGET__YEARLY_LIMIT_CNY:-200.0}
  max_calls_per_run: 100           # 单次 run 调用次数上限（§3.3）
  # ★ 三档单价（元/百万 token），按 provider → model 键控。
  #   来源：DeepSeek 定价页（核对 2026-10-24）；换供应商 = 加一行价格，不改代码。
  prices:
    deepseek:
      deepseek-v4-flash:
        input_cached_cny_per_1m: 0.02
        input_miss_cny_per_1m: 1.0
        output_cny_per_1m: 2.0
      deepseek-v4-pro:
        input_cached_cny_per_1m: 0.025
        input_miss_cny_per_1m: 3.0
        output_cny_per_1m: 6.0

http:
  timeout_connect_s: 5.0
  timeout_read_s: 20.0             # arXiv 单次返回较大，20s 起
  max_concurrency: 6
  max_retries: 3
  user_agent: "ai-scholar/0.1 (+https://github.com/tochikoma777/ai-scholar)"

export:
  # ★ 默认导出条数：§5.6 明确否掉"默认全量"（年增 18.8 万篇会让 Obsidian 不可用）
  default_limit: 20
  filename_max_len: 80
  # 「关联文献」每类（引用了 / 被引用）最多显示条数，超出显示"还有 X 篇"
  links_max_per_section: 10
  # ★ vault 是独立 private 仓库，必须落在代码仓库之外。
  #   只准 `~/` 开头（程序 expanduser），禁止写死家目录绝对路径：
  #   ① 泄露用户名 ② 别人 clone 后路径不存在。
  out_dir: ${AI_SCHOLAR_EXPORT__OUT_DIR:-~/projects/ai-scholar-vault}
  # ★ L5a 静态 HTML 单文件站点：默认同样落在代码仓库之外（public 产物不堆进代码仓库）
  site_dir: ${AI_SCHOLAR_EXPORT__SITE_DIR:-~/projects/ai-scholar-site}
  site_days: 7                     # 趋势区展示最近几天报告（含最新一天详版）
  site_max_papers: 50              # 单页论文条数上限（体积与信息量的折中）

collect:
  # ★ 单日实测 465 条（§12），200 会把当天截断 —— 取 600 留余量（3 页 × 1 req/3s）
  arxiv_max_results: 600
  # ★ D-1：arXiv 单页读超时（全局 http 20s 不够；2026-10-26 实测整日 ReadTimeout）
  arxiv_read_timeout_s: 60
  hf_days: 1
  deep_dive_top_n: 5               # ★ 通道 A 立刻执行，不看 Tier

sources:
  arxiv:
    enabled: true
    availability: always
    availability_reason: 官方开放 API，本地与 Actions 均可达；无需认证
    rate_limit: 1/3s               # ★ arXiv 官方要求约 1 req / 3s
    time_semantics: discovery      # ★ 索引滞后数天，必须用 first_seen 过滤
    # ★ 实测：http:// 会 301 且在本环境连接更慢，统一用 https
    endpoint: https://export.arxiv.org/api/query
    categories: [cs.AI, cs.CL, cs.LG]
    # ★ 回看窗口（天）：设计方案 §3.3 载明 arXiv 索引滞后 3–7 天，取上限才安全。
    #   实测同一日期 10-21 探测 362 → 10-22 探测 465（隔一天仍增长 28%），
    #   只看"当天"会系统性漏采。
    #   窗口加宽后 HF（滞后 2~4 天）能解析到其 arXiv 原始条目 ⇒ 跨源去重率上升。
    #   重复扫描不产生重复条目：first_seen.jsonl append-only + papers upsert 兜住。
    lookback_days: 7

  hf_daily:
    enabled: true
    # ★ availability 描述"源本身是否公开可用"，**不是**"从某台机器能不能访问"。
    #   本地 WSL 对官方域名连接超时是网络环境问题，不改变源的分级；采集时不可达
    #   只 warning + 跳过该源，不计失败、不影响退出码。配 hf_base_url（镜像）即可解。
    availability: always
    availability_reason: 官方开放 API，无需认证；本地不可达是网络环境问题，配 hf_base_url 可解
    rate_limit: 10/1s
    time_semantics: discovery
    # ★ 实际请求端点：默认官方，可被环境变量覆盖（填镜像基址）。★ 不要硬编码镜像。
    hf_base_url: ${AI_SCHOLAR_SOURCES__HF_DAILY__HF_BASE_URL:-https://huggingface.co/api/daily_papers}

  # L1-A 启用（引用 / 施引数据）。★ 必须走 POST /graph/v1/paper/batch，禁止逐篇 GET
  semantic_scholar:
    enabled: true
    availability: always
    availability_reason: 公开 API；无 key 限速很严（实测 429 频发），有 key 更稳
    rate_limit: 1/1s
    time_semantics: state
    endpoint: https://api.semanticscholar.org/graph/v1/paper/batch
    # ★ 无 key 也能跑（自动降级，退出码 0）；有 key 才发 x-api-key 头
    api_key: ${AI_SCHOLAR_S2_API_KEY}
    # 每批 ids 上限 500；响应超限会自动降半重试（500 → 250 → 125）
    batch_size: 500

enrich:
  # ★ 补齐队列：新论文在 S2 上可能尚未索引，查不到要**重试**，不能只查一次
  max_attempts: 30
  default_limit: 200

signals:
  # ★ 时序采样状态机（§3.7.2）。状态持久化在 papers 表，不每日重算。
  default_limit: 200
  # dormant 复活的**唯一**条件（★ 不含 age —— age 只决定"何时采"）
  min_citations: 3
  # 观测窗口：first_seen + 90 天仍未成熟 ⇒ dormant
  pending_days: 90
  # 成熟度门槛：published_at + 180 天（快路径 / dormant 复活点）
  maturity_days: 180
  monthly_days: 30
  quarterly_days: 91
  tracked_first_year_days: 365
  retention_years: 3
  sample_retention_days: 365

prescreen:
  # ★ 零成本预筛（规则负面排除，不走 LLM）：只决定"是否进 pending"，**绝不决定入库**
  min_abstract_chars: 200
  # ★ 淘汰集抽样留存率（不是总体放行率）：总量 = N×p + N×(1-p)×r
  retain_ratio: 0.2
  exclude_title_patterns: [erratum, corrigendum, retraction, retracted, withdrawn, "comment on"]

relate:
  # ★ 关联计算（零 LLM）：文献耦合（倒排索引）+ TF-IDF 语义相似（增量）
  bibcoupling_top_n: 10
  bibcoupling_min_weight: 0.1        # Jaccard 阈值
  similarity_top_k: 10
  similarity_min_weight: 0.15        # §5.2 进池阈值
  similarity_strong_weight: 0.30     # §5.2 强关联阈值（★ 消费方是 L3a「关联解读」选题）
  similarity_title_weight: 2.0       # 标题 ×2 + 摘要 ×1
  similarity_max_features: 50000

enhance:
  # ★ L3a 增强对象（§3.6「高价值」）：watchlist 命中的未增强论文，按分降序 Top N
  default_limit: 20
  # 关联解读：每次最多处理的强相似边对数（weight ≥ relate.similarity_strong_weight）
  link_pairs_limit: 10

grade:
  # ★ L3b-1 定级：成熟（published_at ≥ signals.maturity_days）或引用达标才定级
  # ★ 2026-10-26 实测：grading prompt 带引用/元数据，**单次 ¥0.0091**（比一篇 strong 深度分析还贵），
  #   20 篇/天 = ¥0.18/天（占日成本 72%）。日成本是**天天乘 365** 的量，故降到 8 篇（≈¥0.073）。
  #   代价：定级覆盖变慢（积压由延迟定级机制自然消化，不丢条目）。
  default_limit: 8

deep_analysis:
  # ★ 注意力预算：每周最多 5 篇 strong 分析；超限进队列，不降单篇质量
  weekly_limit: 5
  default_limit: 5
  # ★ 正文上限：实测 arXiv 正文 38k–184k 字符；超限**中间省略**（保开头与实验/结论段）
  max_fulltext_chars: 100000
  # ★ 正文下限：短于此视为元数据/占位页（ar5iv 实测只给约 5k 的 abs 页），丢弃
  min_fulltext_chars: 2000
  # ★ D 排序（v1.11 定案：热度 / 经典**交替** + 已读去重，§5.5）
  #   热度侧 = hf_score 非空且 first_seen 在最近 N 天内的新增（缺失显示 —，不当作 0）
  trending_lookback_days: 1
  #   经典侧来源之一：库内**引用榜** Top N（被本库论文引用最多的工作，零成本、数据驱动）
  citation_leaders: 10
  # 背景透镜（默认芯片/硬件；可换 generic/backend）
  lens:
    profile: chip
    column_header: 芯片/硬件背景
    q1_hint: 算力/带宽/显存
    q2_hint: 访存换计算
    q3_hint: 额外 kernel/通信
    q4_hint: 序列短 / batch 小
    q5_hint: 稀疏化/流水线

predictions:
  # ★ L4 推演（零 LLM）：阈值 = 基线 × 增长系数，向上取整
  direction_window_days: 30
  direction_horizon_days: 30
  min_direction_papers: 30
  direction_growth_factor: 1.1
  entity_window_days: 90
  entity_horizon_days: 30
  min_entity_mentions: 5
  entity_growth_factor: 1.2
  citation_min_current: 5
  citation_horizon_days: 180
  citation_growth_factor: 1.5
  # 单次最多新增条数：防推演通胀，到期后自动验证
  max_new_per_run: 10

calibration:
  # ★ 定级校准：只看成熟论文（published_at + N 天），样本不足时不下结论
  maturity_days: 180
  min_sample_per_tier: 20

impact:
  # ★ 影响分析：至少 2 个快照且跨 N 天，才谈增长；同期样本不足只报数字
  min_snapshots: 2
  min_span_days: 60
  min_cohort: 20
  default_limit: 20
