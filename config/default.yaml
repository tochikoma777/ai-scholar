# AI Scholar 主配置。
#
# ★ 凡是"环境开关"（api_key / base_url / 运行档位）**必须**写成 `${ENV}` 占位符：
#   `load_settings()` 用 `Settings(**yaml)` 构造，init kwargs 优先级高于环境变量，
#   写成字面量会把环境变量静默压掉（aipulse 踩过的坑）。
#   算法阈值 / 规模参数可以留字面量。

app:
  name: ai-scholar
  timezone: Asia/Shanghai          # 存储统一 UTC，仅渲染层转此时区
  data_dir: data
  log_level: ${AI_SCHOLAR_LOG_LEVEL:-INFO}

# 三档运行模式：off = 零 API 花费；fast = 便宜档；strong = 推理档
# ★ 缺 api_key（或 base_url）时自动降级 off，不报错退出（退出码 0）
mode: ${AI_SCHOLAR_MODE:-fast}

llm:
  enabled: ${AI_SCHOLAR_LLM__ENABLED:-true}
  provider: deepseek
  base_url: ${AI_SCHOLAR_LLM__BASE_URL}
  api_key: ${AI_SCHOLAR_LLM__API_KEY}
  fast_model: ${AI_SCHOLAR_LLM__FAST_MODEL:-deepseek-chat}
  strong_model: ${AI_SCHOLAR_LLM__STRONG_MODEL:-deepseek-reasoner}
  temperature: 0.3
  # strong 档走思维链，比 fast 慢得多，故分开设超时
  timeout_s: ${AI_SCHOLAR_LLM__TIMEOUT_S:-120}
  timeout_strong_s: ${AI_SCHOLAR_LLM__TIMEOUT_STRONG_S:-180}
  max_tokens_fast: ${AI_SCHOLAR_LLM__MAX_TOKENS_FAST:-4000}
  max_tokens_strong: ${AI_SCHOLAR_LLM__MAX_TOKENS_STRONG:-8000}
  max_retries: 3

budget:
  daily_limit_cny: ${AI_SCHOLAR_BUDGET__DAILY_LIMIT_CNY:-2.0}
  price_fast_cny_per_1m: 1.0       # 成本估算单价（元/百万 token），可调
  price_strong_cny_per_1m: 4.0

http:
  timeout_connect_s: 5.0
  timeout_read_s: 20.0             # arXiv 单次返回较大，20s 起
  max_concurrency: 6
  max_retries: 3
  user_agent: "ai-scholar/0.1 (+https://github.com/tochikoma777/ai-scholar)"

export:
  # ★ 默认导出条数：§5.6 明确否掉"默认全量"（年增 18.8 万篇会让 Obsidian 不可用）
  default_limit: 20
  filename_max_len: 80
  # 「关联文献」每类（引用了 / 被引用）最多显示条数，超出显示"还有 X 篇"
  links_max_per_section: 10
  # ★ vault 是独立 private 仓库，必须落在代码仓库之外。
  #   只准 `~/` 开头（程序 expanduser），禁止写死家目录绝对路径：
  #   ① 泄露用户名 ② 别人 clone 后路径不存在。
  out_dir: ${AI_SCHOLAR_EXPORT__OUT_DIR:-~/projects/ai-scholar-vault}

collect:
  # ★ 单日实测 465 条（§12），200 会把当天截断 —— 取 600 留余量（3 页 × 1 req/3s）
  arxiv_max_results: 600
  hf_days: 1
  deep_dive_top_n: 5               # ★ 通道 A 立刻执行，不看 Tier

sources:
  arxiv:
    enabled: true
    availability: always
    availability_reason: 官方开放 API，本地与 Actions 均可达；无需认证
    rate_limit: 1/3s               # ★ arXiv 官方要求约 1 req / 3s
    time_semantics: discovery      # ★ 索引滞后数天，必须用 first_seen 过滤
    # ★ 实测：http:// 会 301 且在本环境连接更慢，统一用 https
    endpoint: https://export.arxiv.org/api/query
    categories: [cs.AI, cs.CL, cs.LG]
    # ★ 回看窗口（天）：设计方案 §3.3 载明 arXiv 索引滞后 3–7 天，取上限才安全。
    #   实测同一日期 10-21 探测 362 → 10-22 探测 465（隔一天仍增长 28%），
    #   只看"当天"会系统性漏采。
    #   窗口加宽后 HF（滞后 2~4 天）能解析到其 arXiv 原始条目 ⇒ 跨源去重率上升。
    #   重复扫描不产生重复条目：first_seen.jsonl append-only + papers upsert 兜住。
    lookback_days: 7

  hf_daily:
    enabled: true
    # ★ availability 描述"源本身是否公开可用"，**不是**"从某台机器能不能访问"。
    #   本地 WSL 对官方域名连接超时是网络环境问题，不改变源的分级；采集时不可达
    #   只 warning + 跳过该源，不计失败、不影响退出码。配 hf_base_url（镜像）即可解。
    availability: always
    availability_reason: 官方开放 API，无需认证；本地不可达是网络环境问题，配 hf_base_url 可解
    rate_limit: 10/1s
    time_semantics: discovery
    # ★ 实际请求端点：默认官方，可被环境变量覆盖（填镜像基址）。★ 不要硬编码镜像。
    hf_base_url: ${AI_SCHOLAR_SOURCES__HF_DAILY__HF_BASE_URL:-https://huggingface.co/api/daily_papers}

  # L1-A 启用（引用 / 施引数据）。★ 必须走 POST /graph/v1/paper/batch，禁止逐篇 GET
  semantic_scholar:
    enabled: true
    availability: always
    availability_reason: 公开 API；无 key 限速很严（实测 429 频发），有 key 更稳
    rate_limit: 1/1s
    time_semantics: state
    endpoint: https://api.semanticscholar.org/graph/v1/paper/batch
    # ★ 无 key 也能跑（自动降级，退出码 0）；有 key 才发 x-api-key 头
    api_key: ${AI_SCHOLAR_S2_API_KEY}
    # 每批 ids 上限 500；响应超限会自动降半重试（500 → 250 → 125）
    batch_size: 500

enrich:
  # ★ 补齐队列：新论文在 S2 上可能尚未索引，查不到要**重试**，不能只查一次
  max_attempts: 30
  default_limit: 200

signals:
  # ★ 时序采样状态机（§3.7.2）。状态持久化在 papers 表，不每日重算。
  default_limit: 200
  # dormant 复活的**唯一**条件（★ 不含 age —— age 只决定"何时采"）
  min_citations: 3
  # 观测窗口：first_seen + 90 天仍未成熟 ⇒ dormant
  pending_days: 90
  # 成熟度门槛：published_at + 180 天（快路径 / dormant 复活点）
  maturity_days: 180
  monthly_days: 30
  quarterly_days: 91
  tracked_first_year_days: 365
  retention_years: 3
  sample_retention_days: 365

prescreen:
  # ★ 零成本预筛（规则负面排除，不走 LLM）：只决定"是否进 pending"，**绝不决定入库**
  min_abstract_chars: 200
  # ★ 淘汰集抽样留存率（不是总体放行率）：总量 = N×p + N×(1-p)×r
  retain_ratio: 0.2
  exclude_title_patterns: [erratum, corrigendum, retraction, retracted, withdrawn, "comment on"]

relate:
  # ★ 关联计算（零 LLM）：文献耦合（倒排索引）+ TF-IDF 语义相似（增量）
  bibcoupling_top_n: 10
  bibcoupling_min_weight: 0.1        # Jaccard 阈值
  similarity_top_k: 10
  similarity_min_weight: 0.15        # §5.2 进池阈值
  similarity_strong_weight: 0.30     # §5.2 强关联阈值（仅用于展示标注）
  similarity_title_weight: 2.0       # 标题 ×2 + 摘要 ×1
  similarity_max_features: 50000
